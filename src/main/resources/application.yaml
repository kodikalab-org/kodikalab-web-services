server:
  port: 8080
  servlet:
    context-path: /api
# Configuración de respuestas de error
  error:
    include-stacktrace: never
    include-exception: false
spring:
  application:
    name: kodikalab

  # 1. Conexión a Base de Datos
  datasource:
    url: >-
      jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kodikalab_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # 2. Configuración de JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 3. Servicio de Correo (Spring Mail)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 4. Parámetros para seguridad (JWT sin estado, cabecera Authorization: Bearer)
jwt:
  # Sin valor por defecto: defina JWT_SECRET (mínimo 32 caracteres, p. ej. 'openssl rand -hex 32').
  secret: ${JWT_SECRET:}
  # Vigencia del token en milisegundos (por defecto 24 horas).
  expiration: ${JWT_EXPIRATION:86400000}

kodikalab:
  cors:
    # Orígenes del frontend autorizados a llamar a la API (separados por comas).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
  integrations:
    codeforces:
      base-url: ${CODEFORCES_API_BASE_URL:https://codeforces.com/api}
      timeout-ms: ${CODEFORCES_API_TIMEOUT_MS:3000}
