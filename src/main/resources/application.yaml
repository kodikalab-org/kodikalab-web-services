server:
  port: 8080
  servlet:
    context-path: /api
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        # Enable on HTTPS deployments; false only for local HTTP development.
        secure: ${SESSION_COOKIE_SECURE:false}
# Configuración de respuestas de error
  error:
    include-stacktrace: never
    include-exception: false
spring:
  application:
    name: kodikalab

  # 1. Conexión a Base de Datos
  datasource:
    url: >-
      jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kodikalab_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # 2. Configuración de JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 3. Servicio de Correo (Spring Mail)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# 4. Parámetros para seguridad
jwt:
  secret: >-
    ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 horas en milisegundos

kodikalab:
  integrations:
    codeforces:
      base-url: ${CODEFORCES_API_BASE_URL:https://codeforces.com/api}
      timeout-ms: ${CODEFORCES_API_TIMEOUT_MS:3000}
