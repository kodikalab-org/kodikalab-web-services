# Perfil completo con OpenAI: chat, embeddings, transcripción y voz. No activar junto con ai-groq.
spring:
  ai:
    model:
      chat: openai
      embedding: openai
      audio:
        transcription: openai
        speech: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
          temperature: 0
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      audio:
        transcription:
          options:
            model: ${OPENAI_TRANSCRIPTION_MODEL:whisper-1}
        speech:
          options:
            model: ${OPENAI_SPEECH_MODEL:gpt-4o-mini-tts}
            voice: alloy
