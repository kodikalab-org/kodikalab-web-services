# Render supplies environment variables; no local credentials are required.
spring:
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      data-source-properties:
        sslmode: require
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
server:
  forward-headers-strategy: framework
kodikalab:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
